<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus Lost and Found Management System - report lost belongings, publish found items and recover them." />
    <title>Campus Lost &amp; Found</title>
    <script>
      // Apply the saved theme before first paint so there is no light flash.
      (function () {
        try {
          var saved = localStorage.getItem('clf_theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
